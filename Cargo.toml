[package]
name = "palp"
version = "0.3.0"
edition = "2021"
authors = ["Ralph Cajipe <ralphcajipe@gmail.com>"]
description = "A fast, safe, and friendly mobile and desktop screen driver for AI coding agents and developers"
readme = "README.md"
homepage = "https://github.com/ralphcajipe/palp"
repository = "https://github.com/ralphcajipe/palp"
license = "MIT OR Apache-2.0"
keywords = ["mobile", "desktop", "agent", "adb", "automation"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
quick-xml = "0.37"
thiserror = "2.0"
colored = "2.2"
ctrlc = { version = "3.5", features = ["termination"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Unwind, not abort: aborting skips Drop, which is what puts the phone's animations back.
panic = "unwind"
strip = true
